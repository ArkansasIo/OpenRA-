name: Build Full Desktop Game

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging dependency
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: Build full game packages
        shell: bash
        run: |
          mkdir -p build/linux
          VERSION="devtest-${GITHUB_SHA::7}"
          ./packaging/linux/buildpackage.sh "$VERSION" "$PWD/build/linux"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: openra-linux-appimages
          path: build/linux/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Installers and Portable ZIPs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis wine64 imagemagick zip python3

      - name: Build full game packages
        shell: bash
        run: |
          mkdir -p build/windows
          VERSION="devtest-${GITHUB_SHA::7}"
          ./packaging/windows/buildpackage.sh "$VERSION" "$PWD/build/windows"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: openra-windows-installers
          path: build/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Universal App Bundles
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build full game packages
        shell: bash
        run: |
          mkdir -p build/macos
          VERSION="devtest-${GITHUB_SHA::7}"
          ./packaging/macos/buildpackage.sh "$VERSION" "$PWD/build/macos"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: openra-macos-apps
          path: build/macos/*
          if-no-files-found: error
          retention-days: 14
